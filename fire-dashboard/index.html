<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="main.css" />
</head>
<body>
    <!-- Top Statistics Strip -->
    <div id="top-bar">
        <div class="stat-box">Total Fires: <span id="stat-total">0</span></div>
        <div class="stat-box">Controlled (Routine) Fires: <span id="stat-controlled">0</span></div>
        <div class="stat-box">Unintended (Non-Routine) Fires: <span id="stat-unintended">0</span></div>
    </div>

    <!-- Secondary Filter Ribbon -->
    <div id="filter-bar">
        <div class="filter-group">
            <label for="category-filter">Category:</label>
            <select id="category-filter" class="dropdown">
                <option value="all">All Classifications</option>
                <option value="gas_flare">Gas Flares</option>
                <option value="industrial_fire">Industrial Disasters</option>
                <option value="mining_activity">Mining Activity</option>
                <option value="wildfire">Wildfires</option>
                <option value="agricultural_burning">Agricultural Burns</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="state-filter">State:</label>
            <select id="state-filter" class="dropdown">
                <option value="all">All of India</option>
                <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                <option value="Andhra Pradesh">Andhra Pradesh</option>
                <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                <option value="Assam">Assam</option>
                <option value="Bihar">Bihar</option>
                <option value="Chandigarh">Chandigarh</option>
                <option value="Chhattisgarh">Chhattisgarh</option>
                <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
                <option value="Delhi">Delhi</option>
                <option value="Goa">Goa</option>
                <option value="Gujarat">Gujarat</option>
                <option value="Haryana">Haryana</option>
                <option value="Himachal Pradesh">Himachal Pradesh</option>
                <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                <option value="Jharkhand">Jharkhand</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Kerala">Kerala</option>
                <option value="Ladakh">Ladakh</option>
                <option value="Lakshadweep">Lakshadweep</option>
                <option value="Madhya Pradesh">Madhya Pradesh</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Manipur">Manipur</option>
                <option value="Meghalaya">Meghalaya</option>
                <option value="Mizoram">Mizoram</option>
                <option value="Nagaland">Nagaland</option>
                <option value="Odisha">Odisha</option>
                <option value="Puducherry">Puducherry</option>
                <option value="Punjab">Punjab</option>
                <option value="Rajasthan">Rajasthan</option>
                <option value="Sikkim">Sikkim</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Telangana">Telangana</option>
                <option value="Tripura">Tripura</option>
                <option value="Uttar Pradesh">Uttar Pradesh</option>
                <option value="Uttarakhand">Uttarakhand</option>
                <option value="West Bengal">West Bengal</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="frp-filter">Min FRP (k MW):</label>
            <div class="frp-input-container">
                <input type="number" id="frp-filter" class="dropdown" placeholder="e.g., 10" min="0">
                <small id="max-frp-label">Max FRP: 0 k MW</small>
            </div>
        </div>
    </div>

    <!-- Main Content Layout -->
    <div id="dashboard-container">
        <!-- Control Panel -->
        <div id="controls-panel">
            <select id="map-style" class="dropdown">
                <option value="standard">Standard Map</option>
                <option value="high-contrast">Dark Mode Map</option>
                <option value="satellite">Satellite Imagery Map</option>
            </select>
        </div>

        <!-- Dynamic Side Drawer -->
        <div id="side-drawer" class="hidden">
            <button id="close-drawer">✕ Close</button>
            <div id="drawer-content"></div>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
