<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="main.css" />
</head>
<body>
    <!-- Hamburger Menu -->
    <div id="hamburger-menu">
        <button id="menu-btn">&#9776;</button>
        <div id="menu-content" class="hidden">
            <div class="menu-item" onclick="window.toggleSubmenu('active-fires-wrapper')">Active fires <span class="arrow">&#9660;</span></div>
            <div id="active-fires-wrapper" class="hidden submenu">
                <!-- Dynamically populated by app.js -->
            </div>
            
            <div class="menu-item" id="btn-check-new">Check for new active fires</div>
            <div class="menu-item" id="btn-save-archive">Save data to archive</div>
            
            <div class="menu-item" onclick="window.toggleSubmenu('archive-store-wrapper')">Archive Store <span class="arrow">&#9660;</span></div>
            <div id="archive-store-wrapper" class="hidden submenu">
                <!-- Dynamically populated by app.js -->
            </div>
        </div>
    </div>

    <!-- Top Statistics Strip -->
    <div id="top-bar">
        <div class="stat-box">Total Fires: <span id="stat-total">0</span></div>
        <div class="stat-box">Controlled (Routine) Fires: <span id="stat-controlled">0</span></div>
        <div class="stat-box">Unintended (Non-Routine) Fires: <span id="stat-unintended">0</span></div>
    </div>

    <!-- Secondary Filter Ribbon -->
    <div id="filter-bar">
        <div class="filter-group">
            <label for="category-filter">Category:</label>
            <select id="category-filter" class="dropdown">
                <option value="all">All Classifications</option>
                <option value="gas_flare">Gas Flares</option>
                <option value="industrial_fire">Industrial Disasters</option>
                <option value="mining_activity">Mining Activity</option>
                <option value="wildfire">Wildfires</option>
                <option value="agricultural_burning">Agricultural Burns</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="state-filter">State:</label>
            <select id="state-filter" class="dropdown">
                <option value="all">All of India</option>
                <option value="Andhra Pradesh">Andhra Pradesh</option>
                <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                <option value="Assam">Assam</option>
                <option value="Bihar">Bihar</option>
                <option value="Chhattisgarh">Chhattisgarh</option>
                <option value="Goa">Goa</option>
                <option value="Gujarat">Gujarat</option>
                <option value="Haryana">Haryana</option>
                <option value="Himachal Pradesh">Himachal Pradesh</option>
                <option value="Jharkhand">Jharkhand</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Kerala">Kerala</option>
                <option value="Madhya Pradesh">Madhya Pradesh</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Manipur">Manipur</option>
                <option value="Meghalaya">Meghalaya</option>
                <option value="Mizoram">Mizoram</option>
                <option value="Nagaland">Nagaland</option>
                <option value="Odisha">Odisha</option>
                <option value="Punjab">Punjab</option>
                <option value="Rajasthan">Rajasthan</option>
                <option value="Sikkim">Sikkim</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Telangana">Telangana</option>
                <option value="Tripura">Tripura</option>
                <option value="Uttar Pradesh">Uttar Pradesh</option>
                <option value="Uttarakhand">Uttarakhand</option>
                <option value="West Bengal">West Bengal</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="frp-filter">Min FRP (k MW):</label>
            <div class="frp-input-container">
                <input type="number" id="frp-filter" class="dropdown" placeholder="e.g., 10" min="0">
                <small id="max-frp-label">Max FRP: 0 k MW</small>
            </div>
        </div>
    </div>

    <!-- Main Content Layout -->
    <div id="dashboard-container">
        <div id="controls-panel">
            <select id="map-style" class="dropdown">
                <option value="standard">Standard Map</option>
                <option value="high-contrast">High Contrast</option>
                <option value="satellite">Satellite Imagery</option>
            </select>
        </div>

        <!-- Dynamic Side Drawer -->
        <div id="side-drawer" class="hidden">
            <button id="close-drawer">Close X</button>
            <div id="drawer-content"></div>
        </div>

        <div id="map"></div>
    </div>

    <!-- Live Clock Display -->
    <div id="clock-container">
        <div id="clock-time">--:--:--</div>
        <div id="clock-date">--/--/----</div>
    </div>

    <!-- Notification Toast -->
    <div id="notification-toast" class="hidden"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
